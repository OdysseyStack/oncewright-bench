name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # Every *.test.mjs in the plugin, named by its pattern: without one, Node 24 also runs
      # peek's *.test.ts, which only `claude plugin test` can run (the peek job). The count is
      # read back and must equal the tests the files define, one top-level `test(` line each,
      # with none skipped or left to do: so a test file node --test stops finding fails the
      # job, and so does a run of zero tests, which still exits 0.
      - name: node --test
        shell: bash
        run: |
          node --test --test-reporter=tap "**/*.test.mjs" 2>&1 | tee test.tap
          grep -E '^# (tests|pass|fail|skipped|todo) ' test.tap
          defined=$(grep -rh --include='*.mjs' '^test(' . | wc -l | tr -d ' ')
          echo "tests the files define: $defined"
          test "$defined" -gt 0
          grep -q "^# tests $defined\$" test.tap
          grep -q '^# skipped 0$' test.tap
          grep -q '^# todo 0$' test.tap

  validate:
    name: claude plugin validate --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # The version the kit was tested on (README, Requirements).
      - run: npm install -g @anthropic-ai/claude-code@2.1.289
      - run: claude plugin validate . --strict
      # Only these two catch a skill or agent whose frontmatter fails to parse.
      - run: claude plugin validate skills --strict
      - run: claude plugin validate agents --strict
      - run: claude plugin validate mods/peek --strict
      - run: claude plugin validate mods/wrap-up --strict

  # The mods' tests, peek's and wrap-up's, on each system, in the environment its hooks run in; no sign-in needed. The
  # summary is read back: every test file ran, and none failed.
  peek:
    name: claude plugin test, the mods (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@2.1.289
      - name: claude plugin test mods/peek
        shell: bash
        run: |
          claude plugin test mods/peek 2>&1 | tee peek.txt
          files=$(ls mods/peek/tests/*.test.ts | wc -l | tr -d ' ')
          echo "test files: $files"
          grep -qE "^Ran [1-9][0-9]* tests across $files files\." peek.txt
          grep -q '^ 0 fail$' peek.txt
      - name: claude plugin test mods/wrap-up
        shell: bash
        run: |
          claude plugin test mods/wrap-up 2>&1 | tee wrap-up.txt
          files=$(ls mods/wrap-up/tests/*.test.tsx | wc -l | tr -d ' ')
          echo "test files: $files"
          grep -qE "^Ran [1-9][0-9]* tests across $files files?\." wrap-up.txt
          grep -q '^ 0 fail$' wrap-up.txt

  # index-it's survey script is the kit's one Python program: this keeps a syntax error in it
  # from shipping, and runs its test of the memory index's size limits.
  python:
    name: python3 -m py_compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m py_compile skills/index-it/scripts/survey.py
      - run: python3 -B skills/index-it/scripts/survey_test.py

  # The one check the branch rules require: green only when every job above is.
  ci:
    name: ci
    if: always()
    needs: [test, validate, python, peek]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ join(needs.*.result, ' ') }}" = "success success success success"
